tags:
  - Auth
summary: Register user
operationId: registerUser
description: 'Register new user'
security: []
requestBody:
  content:
    application/json:
      schema:
        type: object
        required:
          - name
          - email
          - password
        properties:
          name:
            description: 'User`s Name'
            type: string
          email:
            description: 'User`s Email'
            type: string
          password:
            description: 'User`s Password'
            type: string
responses:
  '201':
    description: Successfully registered a user!
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 201
            message:
              type: string
              example: Successfully registered a user!
            data:
              type: object
              required:
                - _id
                - name
                - email
              properties:
                _id:
                  type: string
                  example: '3FqR7Lm8ZxS2Kb9HcV5TnW0JdEeP1Yz6AgQrVu3W'
                name:
                  type: string
                  example: 'Vitaliy Klichko'
                email:
                  type: string
                  example: 'klichko@rada.com'
  '409':
    $ref: '../../components/responses/409.yaml'
